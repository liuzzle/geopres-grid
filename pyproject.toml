[project]
name = "geopres-grid"
version = "0.1.0"
description = "Combining dimensionality reduction and quantization for efficient embedding indexes."
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate",
    "datasets",
    "huggingface-hub>=0.34.0,<1.0",
    "mteb==2.15.1",
    "numpy",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "safetensors",
    "scikit-learn",
    "scipy",
    # Floor at 5.7: lightonai/mDenseOn declares its modules under the refactored
    # `sentence_transformers.base.modules.*` paths, absent before 5.4.
    # Ceiling below 6.0 on supervisor guidance: 6.x introduces new bugs and
    # compatibility issues. Do not raise without retesting the whole model set.
    "sentence-transformers>=5.7.0,<6.0.0",
    "tokenizers>=0.22.0,<=0.23.0",
    "torch",
    "tqdm",
    "transformers==4.56.0",
]

[project.optional-dependencies]
# Differentiable Spearman loss for the GeoPres projection. Builds from source and
# needs the CUDA toolchain; imported lazily so the rest of the package works without it.
# See README -> "torchsort".
spearman = ["torchsort"]
flash-attn = ["flash-attn>=2.5.0"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geopres_grid"]
